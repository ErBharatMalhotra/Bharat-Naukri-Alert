name: Scheduled Tasks

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '0 5 * * *'    # 10:30 AM IST
    - cron: '30 7 * * *'   # 1:00 PM IST
    - cron: '0 10 * * *'   # 3:30 PM IST
    - cron: '30 12 * * *'  # 6:00 PM IST
    - cron: '0 15 * * *'   # 8:30 PM IST
  workflow_dispatch:
    inputs:
      indexing_dry_run:
        description: "Print the Google Indexing API plan without sending anything"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Header auth, not a token in the URL: the URL form loses its credential on
      # GitHub's 301 redirect and the job died with "could not read Username"
      # (2026-10-19..22 — 4 of these runs were lost at this step alone). The same
      # header is what the pushes back to core below authenticate with.
      - name: Checkout private core
        uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.CORE_TOKEN }}

      - name: Sync sources
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
        run: |
          echo "$SOURCES_JSON" > core/sources/sources.private.json
          echo '{}' > core/sources/sources.json
          cp core/sources/sources.private.json core/sources/sources.json

      - name: Gemini fleet health (discover + probe models)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        run: |
          cd core
          node engine/fleet-health.js || true

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_1 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
          EDITOR_NOTE_MAX: 50
          DETAIL_FETCH_MAX: 50
        run: |
          cd core
          node engine/scrape.js
          node engine/backfill-quality.js || true
          node site/build.js

      - name: Run tests
        run: cd core && node tests/run.js

      # Structural gate on the REAL build that is about to be published.
      # The test suite only builds a small fixture, so it cannot see link and
      # canonical damage that only exists across all ~570 generated pages.
      # Nothing gets pushed to the public branch unless this is CLEAN.
      - name: Site health gate (broken links, canonicals, redirects, sitemap)
        run: cd core && node scripts/site-health.mjs site/dist

      # The same guarantee one level up: a URL we published must never 404. Reads
      # data/published-urls.json (every /o/ URL this site has ever shipped) and the
      # build's own _urlmap.json, so the 45-day grace window and the 410 tombstones
      # are checked on every run instead of when someone remembers to look.
      - name: URL class gate (every published /o/ URL answers 200, 301 or 410)
        run: cd core && node scripts/check-url-classes.mjs

      - name: Send Telegram digest
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          cd core
          node telegram/digest.js

      - name: Save results to core
        if: success()
        run: |
          cd core
          git config user.name "Bharat Malhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          git add -A
          git stash
          git pull --rebase origin main
          if ! git stash pop; then
            # Conflict: freshly scraped data (the stash) wins over remote.
            # Never commit conflict markers — resolve programmatically.
            git checkout --theirs . || true
            git add -A
            git stash drop || true
          fi
          # Safety net: refuse to COMMIT any conflict markers. Checks only ADDED
          # lines of the staged diff — an empty index (clean stash pop, changes
          # unstaged) must fall through, never fail the save (xargs -r exits 0).
          if git diff --cached | grep -qE '^\+<<<<<<< |^\+>>>>>>> '; then
            echo "::error::conflict markers present, aborting save"
            git reset --hard
            exit 1
          fi
          git add -A
          git diff --cached --quiet || git commit -m "update: $(date -u +%Y-%m-%d-%H%M)"
          bash "$GITHUB_WORKSPACE/.github/scripts/push-retry.sh" main

      # The workspace IS a checkout of this public repo, so the build output is
      # committed in place. The old step cloned the repo a second time into
      # /tmp with the token in the URL — the same redirect trap that killed the
      # core clone, plus a needless second fetch of the same repository.
      - name: Push dist to public repo
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Bharat Malhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          # Never publish an empty site or an empty functions dir: a missing build
          # would otherwise delete every page and every Pages Function.
          test -d core/site/dist || { echo "::error::core/site/dist missing — refusing to publish"; exit 1; }
          test -n "$(ls -A core/site/dist)" || { echo "::error::core/site/dist is empty — refusing to publish"; exit 1; }
          test -d core/site/functions || { echo "::error::core/site/functions missing — refusing to publish"; exit 1; }
          rm -rf site/dist functions
          mkdir -p site/dist functions
          cp -r core/site/dist/. site/dist/
          # Pages Functions live at the repo root, not in the build output. The /o/*
          # middleware is what answers 410 for a listing past its grace window —
          # _redirects cannot express 410 at all (301/302/303/307/308 only).
          cp -r core/site/functions/. functions/
          git add -A -- site/dist functions
          git diff --cached --quiet || git commit -m "update: $(date -u +%Y-%m-%d-%H%M)"
          bash .github/scripts/push-retry.sh main

      # LAST step on purpose: the pages have to be live before Google is told they
      # changed. DISABLED by default — set the repository variable
      # INDEXING_ENABLED=true to arm it. GSC_INDEXING_KEY has to live in THIS
      # repository's Actions secrets, because this is the workflow that calls the
      # API (the private core cannot run workflows). The step never fails the run:
      # it logs what it sent and, with the dry-run input, makes no network call.
      - name: Google Indexing API (job pages only)
        if: ${{ success() && (vars.INDEXING_ENABLED == 'true' || inputs.indexing_dry_run) }}
        continue-on-error: true
        working-directory: core
        env:
          INDEXING_ENABLED: ${{ vars.INDEXING_ENABLED }}
          GSC_INDEXING_KEY: ${{ secrets.GSC_INDEXING_KEY }}
        run: node scripts/indexing-api.mjs ${{ inputs.indexing_dry_run && '--dry-run' || '' }}

      # The ledger is the only thing that keeps a run from re-submitting the same
      # URLs, so it is committed back to the core even though the site push already
      # happened.
      - name: Save indexing ledger to core
        if: ${{ success() && vars.INDEXING_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          cd core
          git config user.name "Bharat Malhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          git add data/indexing-ledger.json
          git diff --cached --quiet || git commit -m "indexing: ledger $(date -u +%Y-%m-%d-%H%M)"
          git pull --rebase origin main
          bash "$GITHUB_WORKSPACE/.github/scripts/push-retry.sh" main
