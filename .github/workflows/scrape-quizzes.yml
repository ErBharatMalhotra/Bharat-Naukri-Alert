name: Daily Quiz Update

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quiz-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone private core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          git clone --depth 1 https://${CORE_TOKEN}@github.com/ErBharatMalhotra/BNA-core.git core

      # QUIZ-DAILY-GENERATION-PLAN.md: planner → generate → 3-layer verify → import.
      # ONLY GEMINI_API_KEY_2/_3 (quiz keys) are injected — jobs key untouched.
      # flash-lite slots only (volume class); verifier never shares the generator slot.
      # Second run (--ca) = PIB news-grounded current-affairs batch (same verify gate).
      - name: Generate + verify original quiz batch
        id: quiz
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_ALLOWED_MODELS: gemini-2.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview,gemini-3.5-flash-lite,gemini-flash-lite-latest
        run: |
          node engine/quiz-daily.js --apply --batches 2 2>&1 | tee /tmp/quiz-output.log
          # CA batch failure (PIB feed down, LLM quota) must NOT block the planner batch save
          node engine/quiz-daily.js --apply --ca 2>&1 | tee /tmp/ca-output.log || echo "WARN: CA batch failed — planner batch unaffected"
          cat /tmp/quiz-output.log /tmp/ca-output.log > /tmp/quiz-all.log
          NEW=$(grep -oP '"accepted":\s*\K\d+' /tmp/quiz-all.log | awk '{s+=$1} END{print s+0}')
          TOTAL=$(grep -oP '"written":\s*\K\d+' /tmp/quiz-all.log | awk '{s+=$1} END{print s+0}')
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Save to private core
        if: steps.quiz.outputs.new != '0'
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          cd core
          git config user.name "Bharat Malhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          # per-path add: one missing pathspec must not abort staging the rest
          for p in data/quiz-bank/generated data/quiz-bank/index.json data/quiz-coverage.json data/fleet-state.json; do
            [ -e "$p" ] && git add "$p"
          done
          git stash
          git pull --rebase origin main
          git stash pop || true
          for p in data/quiz-bank/generated data/quiz-bank/index.json data/quiz-coverage.json data/fleet-state.json; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --cached --quiet || git commit -m "quiz: daily generated batch (+${{ steps.quiz.outputs.new }} verified Q)"
          git push origin main

      - name: Summary
        run: |
          echo "## Daily Quiz Update (generated + verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified questions accepted: ${{ steps.quiz.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Written to bank: ${{ steps.quiz.outputs.total }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline: planner → generate (flash-lite) → deterministic gate → independent re-answer → adjudicate" >> "$GITHUB_STEP_SUMMARY"
          echo "- CA batch: PIB RSS-grounded current-affairs (same 3-layer verify)" >> "$GITHUB_STEP_SUMMARY"
