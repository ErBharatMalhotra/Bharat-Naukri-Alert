name: Daily Quiz Update

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone private core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          git clone --depth 1 https://${CORE_TOKEN}@github.com/ErBharatMalhotra/BNA-core.git core

      - name: Scrape daily current affairs MCQs
        id: quiz
        working-directory: core
        run: |
          node engine/scrape-quizzes.js --source=gktoday 2>&1 | tee /tmp/quiz-output.log
          NEW=$(grep -oP 'Total new questions: \K\d+' /tmp/quiz-output.log || echo "0")
          TOTAL=$(grep -oP 'Total questions in bank: \K\d+' /tmp/quiz-output.log || echo "0")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Save to private core
        if: steps.quiz.outputs.new != '0'
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          cd core
          git config user.name "Bharat Malhotra"
          git config user.email "MR.BHARATMALHOTRA@GMAIL.COM"
          git add data/quiz-bank/
          git diff --cached --quiet || git commit -m "update quiz-bank: $(date -u +%Y-%m-%d) (+${{ steps.quiz.outputs.new }} CA MCQs)"
          git push https://${CORE_TOKEN}@github.com/ErBharatMalhotra/BNA-core.git main

      - name: Summary
        run: |
          echo "## Daily Quiz Update" >> "$GITHUB_STEP_SUMMARY"
          echo "- New questions: ${{ steps.quiz.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total in bank: ${{ steps.quiz.outputs.total }}" >> "$GITHUB_STEP_SUMMARY"
