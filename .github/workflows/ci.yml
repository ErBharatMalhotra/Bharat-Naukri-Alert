name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "memory/**"
      - "site/dist/**"
      - "sources/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: node tests/run.js
      - name: Privacy gate (no portal names in public files)
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
        run: node scripts/privacy-gate.mjs
