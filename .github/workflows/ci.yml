name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/dist/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Header auth, not a token in the URL: the URL form loses its credential
      # on GitHub's 301 and made this job fail before running a single test.
      - name: Checkout private core
        uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.CORE_TOKEN }}

      - name: Run test suite
        working-directory: core
        run: node tests/run.js

      - name: Privacy gate (no portal names in public files)
        working-directory: core
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
        run: node scripts/privacy-gate.mjs
