name: Weekly Evolution

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Header auth instead of https://<token>@github.com/... — the URL form is
      # what GitHub's 301 redirect strips, and it was also the only auth the
      # report push at the bottom had.
      - name: Checkout private core
        uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.CORE_TOKEN }}

      - name: Sync sources
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
        run: |
          echo "$SOURCES_JSON" > core/sources/sources.private.json
          echo '{}' > core/sources/sources.json
          cp core/sources/sources.private.json core/sources/sources.json

      - name: Health check sources
        working-directory: core
        run: node engine/health-check.js

      - name: Run evolution review
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
        run: node engine/evolve.js

      - name: Commit evolution report
        run: |
          cd core
          git config user.name "Bharat Malhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          git add memory
          if ! git diff --cached --quiet; then
            git commit -m "memory: weekly evolution $(date -u +%F) [skip ci]"
            # origin already carries the PAT header from the checkout action,
            # and push-retry.sh retries GitHub's transient 5xx.
            bash "$GITHUB_WORKSPACE/.github/scripts/push-retry.sh" main
          fi
