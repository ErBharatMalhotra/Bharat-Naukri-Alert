name: Weekly Evolution

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Health check sources
        run: node engine/health-check.js
      - name: Run evolution review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node engine/evolve.js
      - name: Commit evolution report
        run: |
          git config user.name "avsar-bot"
          git config user.email "bot@avsar.local"
          git add memory
          if ! git diff --cached --quiet; then
            git commit -m "memory: weekly evolution $(date -u +%F)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
